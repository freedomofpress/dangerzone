# Test official instructions for installing Dangerzone
# ====================================================
#
# The installation instructions have been copied from our INSTALL.md file.
# NOTE: When you change either place, please make sure to keep the two files in
# sync.
# NOTE: Because the commands run as root, the use of sudo is not necessary.
name: Test official instructions for installing Dangerzone
on:
  pull_request:  # REMOVE ME
  schedule:
    - cron: '0 0 * * *' # Run every day at 00:00 UTC.
  workflow_dispatch:

jobs:
  install-linux:
    name: "Install Dangerzone on ${{ matrix.distro}} ${{ matrix.version }} from ${{ matrix.repo }} repo"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ["qa", "prod"]
        include:
          - distro: ubuntu
            version: "25.10"  # questing
          - distro: ubuntu
            version: "26.04"  # resolute
          - distro: ubuntu
            version: "24.04"  # noble
          - distro: ubuntu
            version: "22.04"  # jammy
          - distro: debian
            version: "forky-slim"  # forky / 14
          - distro: debian
            version: "trixie-slim"  # trixie / 13
          - distro: debian
            version: "bookworm-slim"  # bookworm / 12
          - distro: fedora
            version: 43
          - distro: fedora
            version: 44

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check installation instructions in a container
        run: |
          ./dev_scripts/env.py \
              --distro ${{ matrix.distro }} \
              --version ${{ matrix.version }} \
              build \
              --${{ matrix.repo }}

  install-qubes:
    name: "Install dangerzone-qubes on ${{ matrix.distro}} ${{ matrix.version }} from ${{ matrix.repo }} repo"
    runs-on: ubuntu-latest
    container:
      image: "${{ matrix.distro}}:${{ matrix.version }}"
    strategy:
      matrix:
        repo: ["qa", "prod"]
        include:
          - distro: fedora
            version: 43
          - distro: fedora
            version: 44

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check installation instructions in a container
        env:
          REPO: ${{ matrix.repo == 'qa' && '-qa' || '' }}
        run: |
          sudo dnf install 'dnf-command(config-manager)'
          sudo dnf config-manager addrepo --from-repofile=https://packages${{ env.BUILD_FLAG }}.freedom.press/yum-tools-prod/dangerzone/dangerzone${{ env.BUILD_FLAG }}.repo
          sudo dnf install dangerzone-qubes
