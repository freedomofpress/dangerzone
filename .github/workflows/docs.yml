name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!v*-rc*"
    # Path filters do not apply to tag pushes.
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICE.md"
      - "LICENSE"
      - "dev_scripts/templates/**"
      - "dev_scripts/docs_mermaid.py"
      - "dev_scripts/docs_pdf.py"
      - "share/version.txt"
      - "dangerzone/cli.py"
      - "dangerzone/updater/cli.py"
      - "dangerzone/podman/cli.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICE.md"
      - "LICENSE"
      - "dev_scripts/templates/**"
      - "dev_scripts/docs_mermaid.py"
      - "dev_scripts/docs_pdf.py"
      - "share/version.txt"
      - "dangerzone/cli.py"
      - "dangerzone/updater/cli.py"
      - "dangerzone/podman/cli.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install Poetry and the docs dependencies
        run: |
          pipx install poetry
          poetry install --only main,docs
      # WeasyPrint needs Pango, and the fonts the PDF is typeset with.
      - name: Install the PDF export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core fonts-noto-color-emoji
      - name: Check cog
        run: make docs-cog-check
      - name: Build docs
        run: poetry run zensical build --strict
      - name: Build the PDF export
        run: poetry run python dev_scripts/docs_pdf.py

  # Publishes to https://docs.dangerzone.rocks. Cloudflare Pages deploys the
  # `gh-pages` branch, which is updated by this workflow.
  # Pushes to `main` publish the in-progress docs under the `dev` version.
  publish:
    name: Publish the version on the gh-pages branch
    if: github.event_name != 'pull_request' && github.repository == 'freedomofpress/dangerzone'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-gh-pages
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install Poetry and the docs dependencies
        run: |
          pipx install poetry
          poetry install --only main,docs
      # WeasyPrint needs Pango, and the fonts the PDF is typeset with.
      - name: Install the PDF export dependencies
        if: github.ref_type == 'tag'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core fonts-noto-color-emoji
      - name: Regenerate the CLI help embedded in the docs
        run: make docs-cog
      - name: Fetch the previously published versions
        run: git fetch origin gh-pages --depth=1 || true
      # Copy `latest` rather than using a symlink, as Cloudflare Pages
      # does not support symlinks.
      - name: Commit the version with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            poetry run mike deploy --update-aliases --alias-type copy "$(cat share/version.txt)" latest
            poetry run mike set-default latest
          else
            poetry run mike deploy dev
          fi
      # Copy the `_headers` file at the root of the site,
      # where Cloudflare Pages expects it to be.
      - name: Commit the Cloudflare Pages headers
        run: |
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp docs/_headers "$RUNNER_TEMP/gh-pages/_headers"
          cd "$RUNNER_TEMP/gh-pages"
          git add _headers
          git diff --cached --quiet || git commit -m "Update the Cloudflare Pages headers"
      - name: Commit the PDF export
        if: github.ref_type == 'tag'
        run: |
          version="$(cat share/version.txt)"
          poetry run python dev_scripts/docs_pdf.py
          cd "$RUNNER_TEMP/gh-pages"
          for folder in "$version" latest; do
            cp "$GITHUB_WORKSPACE/site/dangerzone-docs.pdf" "$folder/"
            git add "$folder/dangerzone-docs.pdf"
          done
          git commit -m "Add the PDF export of $version"
      - name: Push the gh-pages branch
        run: git push origin gh-pages
