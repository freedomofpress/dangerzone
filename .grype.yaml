  # ================================================================================
  #
  # GitHub advisories:
  # * https://github.com/advisories/GHSA-5x8w-8jj5-q52h
  # * https://github.com/advisories/GHSA-w889-685w-c8fh
  # * https://github.com/advisories/GHSA-332p-7hrc-92wf
  # * https://github.com/advisories/GHSA-8g5g-8vmr-9782
  # * https://github.com/advisories/GHSA-v9pv-5gc8-w2m6
