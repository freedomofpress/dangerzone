  - vulnerability: CVE-2026-112900
  - vulnerability: CVE-2026-112393
  - vulnerability: CVE-2026-112403
  - vulnerability: CVE-2026-96639

  # Brotli (Node2Shell)
  # =====================
  #
  # GitHub advisory: https://github.com/advisories/GHSA-9v8h-qqgm-4m35
